# 定义要使用的 pre-commit 钩子仓库列表
repos:
  # Black 代码格式化工具
  - repo: https://github.com/psf/black
    rev: 25.9.0                                # 使用 23.7.0 版本
    hooks:
      - id: black                              # Black 代码格式化钩子
        language_version: python3.11           # 指定 Python 版本为 3.11

  # isort 导入排序工具
  - repo: https://github.com/pycqa/isort
    rev: 6.0.1
    hooks:
      - id: isort

  # flake8 代码风格检查工具
  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args: ["--max-line-length=88", "--extend-ignore=E203,W503"]

  # mypy 类型检查工具
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.18.2                             # 使用 v1.11.1 版本
  #   hooks:
  #     - id: mypy                              # mypy 类型检查钩子
  #       additional_dependencies: [types-requests]  # 额外的类型依赖
  #       args: [--ignore-missing-imports]     # 忽略缺失的导入错误

  # bandit 安全检查工具
  # - repo: https://github.com/PyCQA/bandit
